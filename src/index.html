    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Toddo List</title>
    </head>
    <body>
        <dialog class="project-dialog">
            <form action="#" class="project-form">
                <input type="text" placeholder="Enter project Name" id="project-input">
                <button type="button" class="close-project-dialog">ok</button>
            </form>
        </dialog>
        
        <dialog class="todo-dialog">
            <form action="#" class="todo-form">
                <div class="title">
                    <label for="todo-title">Title: </label>
                    <input type="text" placeholder="Eg: Bring Chocolates" id="todo-title">
                </div>
                <div class="description">
                    <label for="todo-descrption">Description: </label>
                    <input type="textarea" placeholder="Tell more about the todo" id="todo-description" >
                </div>
                <div class="due-date">
                    <label for="todo-due-date">Due Date: </label>
                    <input type="date" id="todo-due-date">
                </div>
                <div class="priority">
                    <label for="todo-priority">Priority: </label>
                    <select name="todo-priority" id="todo-priority">
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low" selected>Low</option>
                    </select>
                </div>
                <button type="button" class="close-todo-dialog">ok</button>
            </form>
        </dialog>
        <div class="container">
            <div class="left-side">
                <div class="create-projects background-bg ">
                    Projects 
                    <button class="create-project js-open-project-dialog">+</button>
                </div>
                <div class="display-projects">
                </div>
            </div>
            <div class="right-side">
                <div class="todo-content">
                    <h1 class="project-name js-project-name"></h1>
                    <div class="todo-list">
                        
                    </div>
                </div>
            </div>
        </div>
    </body>
    </html>
